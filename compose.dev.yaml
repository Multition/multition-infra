name: multition

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multition}
      POSTGRES_USER: ${POSTGRES_USER:-multition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multition}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multition} -d ${POSTGRES_DB:-multition}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-multition}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-multition-local-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ai:
    profiles: [apps]
    build:
      context: ../multition-ai
    environment:
      APP_ENV: development
      PORT: 8000
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    profiles: [apps]
    build:
      context: ../multition-api
    command: ["node", "dist/cli/migrate.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-multition}:${POSTGRES_PASSWORD:-multition}@postgres:5432/${POSTGRES_DB:-multition}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [apps]
    build:
      context: ../multition-api
    environment:
      NODE_ENV: development
      PORT: 4000
      LOG_LEVEL: info
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-multition}:${POSTGRES_PASSWORD:-multition}@postgres:5432/${POSTGRES_DB:-multition}
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
